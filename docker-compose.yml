services:
  api:
    image: ${SECAGENT_API_IMAGE:-ghcr.io/gl1tch0x1/secagent/api:latest}
    build: { context: ., dockerfile: python-agents/Dockerfile }
    command: ["python", "-m", "uvicorn", "secagents.infra.health_checks:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/0
    depends_on:
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 10s
      timeout: 7s
      retries: 3

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-secagents_redis}", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-secagents_redis}", "ping"]
      interval: 5s
      retries: 5

  rust-core:
    build: { context: ., dockerfile: rust-core/Dockerfile }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/1
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-example.com}
    depends_on:
      redis: { condition: service_healthy }

  recon:
    build: { context: ., dockerfile: go-services/recon/Dockerfile }
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/2
    depends_on:
      redis: { condition: service_healthy }

  worker:
    build: { context: ., dockerfile: python-agents/Dockerfile }
    command: ["python", "-m", "secagents.worker.runner"]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-secagents_redis}@redis:6379/0
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-example.com}
    depends_on:
      redis: { condition: service_healthy }

volumes:
  redis_data:


